scene:
  id: EP2_Act1
  name: Rico工作室门口+室内
  type: 悬疑·单人探索·双空间
  total_duration_s: 20
  total_shots: 4
  axis_side: A侧(门轴对侧·锁孔侧)
  static_shots: 2
  static_ratio: 0.5
global_anchors:
  character:
    伊莎贝拉:
    - Female, late 20s-early 30s, lean build, dark casual clothing, dark hair pulled back
    - 'Core props: 黄铜钥匙(红色标签·老旧·铜绿斑·约5cm)'
    - 'Core: (I1) hand holding brass key at lock level—precise insertion'
    - (I2) hand gripping door handle with whitened knuckles—tension
    - (I3) hand trembling after pulling key from lock—fear tremor
    - (I4) face half-lit by warm 2800K + cold 4000K—boundary between two worlds
  environment:
    description: 'Soviet-style residential corridor, 4:30am. Corridor: ~15m×1.8m×2.8m, plain gray walls, terrazzo floor, circular ceiling fluorescent 4000K. Studio interior: ~5m×4m, industrial hanging lamp
      2800K warm yellow, chiaroscuro. Wooden door 0.9m×2.1m with brass lock.'
    spatial_anchor: Door = boundary between cold corridor(4000K) and warm studio(2800K)
  lighting:
    description: 'Dual color temperature system. CORRIDOR: L1-ceiling fluorescent 4000K cold white, soft diffused. STUDIO: L2-industrial hanging lamp 2800K warm yellow, hard light, ~45deg cone, outside
      cone pitch black. DOOR CRACK: L3-warm 2800K seeping through as thin line→widening rectangle when door opens'
    anchor_sources:
    - source: L1-吸顶荧光灯
      kelvin: 4000
      direction: 天花板·垂直向下·圆形·声控
      ref_grid: 图2格6
    - source: L2-工业吊灯
      kelvin: 2800
      direction: 天花板·垂直向下·光锥~45度·硬光
      ref_grid: 图1格1-6
    - source: L3-门缝暖光
      kelvin: 2800
      direction: 门缝·水平漏出→门开时扩展为三角形光柱
      ref_grid: 图2格5
  style_spine:
    description: shot on Arri Alexa 35, cold fluorescent 4000K corridor vs warm industrial 2800K studio, chiaroscuro single-source interior, blue-orange complementary color contrast, suspense single-character
      POV language, 1.85:1
    palette_anchors:
    - cold-fluorescent-4000K
    - warm-industrial-2800K
    - dark-void-chiaroscuro
    - brass-key-gold
    - blood-stain-dark-red
  constraints:
  - 1000K色温差贯穿全场景
  - 伊莎贝拉肤色作为色温计
  - 染血毛巾暗红是唯一非工业色
  - 黄铜钥匙红色标签——唯一高饱和色点
  - 面部比例全程一致
  - 无画面文字(P-FAL-08)
